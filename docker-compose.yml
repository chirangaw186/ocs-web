# Local development database only. Production uses Neon.
services:
  db:
    image: postgres:16
    ports:
      - "${PAVIELLE_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: pavielle
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/local/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pavielle"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
